  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>
  <text x="32" y="44" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#f08a5d">M</text>
</svg>
